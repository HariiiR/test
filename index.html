
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Car Image Classifier</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #eef2f8;
      margin: 0;
      padding: 50px 16px;
      color: #1e293b;
    }
    .card {
      background: white;
      max-width: 520px;
      margin: auto;
      padding: 32px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 8px 30px #00000012;
    }
    h1 { margin-bottom: 10px; }
    p { color: #64748b; }
    input { margin: 20px 0; max-width: 100%; }
    img {
      display: none;
      width: 100%;
      max-height: 300px;
      object-fit: contain;
      border-radius: 10px;
      margin-bottom: 20px;
    }
    button {
      width: 100%;
      background: #2563eb;
      color: white;
      border: 0;
      padding: 15px;
      border-radius: 9px;
      font-size: 16px;
      cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: not-allowed; }
    #result {
      margin-top: 24px;
      font-weight: bold;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>🚗 Car Image Classifier</h1>
    <p>Upload a car photo to identify its category.</p>

    <input type="file" id="imageInput" accept="image/*">
    <img id="preview" alt="Uploaded car photo">

    <button id="classifyBtn" disabled>
      Classify Car
    </button>

    <div id="result" role="status"></div>
  </main>

  <script>
    // Replace this after deploying your Hugging Face Space.
    const API_URL = "";

    const input = document.getElementById("imageInput");
    const preview = document.getElementById("preview");
    const button = document.getElementById("classifyBtn");
    const result = document.getElementById("result");

    input.addEventListener("change", () => {
      const file = input.files[0];
      result.textContent = "";
      button.disabled = !file;

      if (!file) {
        preview.style.display = "none";
        preview.removeAttribute("src");
        return;
      }

      preview.src = URL.createObjectURL(file);
      preview.style.display = "block";
    });

    button.addEventListener("click", async () => {
      const file = input.files[0];
      if (!file) return;

      if (!API_URL) {
        result.textContent =
          "Website ready! Connect the Hugging Face API next.";
        return;
      }

      button.disabled = true;
      result.textContent = "Classifying image...";

      try {
        const form = new FormData();
        form.append("file", file);

        const response = await fetch(API_URL, {
          method: "POST",
          body: form
        });

        if (!response.ok) {
          throw new Error("API returned " + response.status);
        }

        // Expected response:
        // { "label": "SUV", "confidence": 0.95 }
        const prediction = await response.json();

        if (
          typeof prediction.label !== "string" ||
          typeof prediction.confidence !== "number"
        ) {
          throw new Error("Unexpected API response");
        }

        result.textContent =
          "Prediction: " + prediction.label +
          " | Confidence: " +
          (prediction.confidence * 100).toFixed(1) + "%";
      } catch (error) {
        result.textContent = "Error: " + error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
